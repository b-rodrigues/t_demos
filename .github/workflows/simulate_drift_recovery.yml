name: Drift Recovery Simulation

on:
  workflow_dispatch:  # Manual trigger for demonstration
  push:
    branches: [ master ]
    paths:
      - 'drift_guardrail_t/**'
      - '.github/workflows/simulate_drift_recovery.yml'

jobs:
  simulate-workflow:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Nix
      uses: cachix/install-nix-action@v27
      with:
        nix_path: nixpkgs=channel:nixos-unstable

    - name: Setup Cachix
      uses: cachix/cachix-action@v15
      with:
        name: rstats-on-nix
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

    - name: 1. Initial Run (Passing)
      working-directory: ./drift_guardrail_t
      run: |
        echo "Starting initial run with threshold 15.0..."
        nix develop --command t run src/pipeline.t --unsafe

    - name: 2. Trigger Guardrail Failure (Set threshold to 2.0)
      working-directory: ./drift_guardrail_t
      run: |
        echo "Injecting failure condition via sed..."
        sed -i 's/drift_val < 15.0/drift_val < 2.0/' src/pipeline.t
        grep "assert" src/pipeline.t

    - name: 3. Run Pipeline (Expecting Failure)
      working-directory: ./drift_guardrail_t
      id: run_fail
      continue-on-error: true
      run: |
        echo "Running pipeline with tight threshold..."
        nix develop --command t run src/pipeline.t --unsafe

    - name: 4. Inspect Failure (Verify Guardrail Triggered)
      working-directory: ./drift_guardrail_t
      run: |
        echo "Verifying guardrail failure..."
        nix develop --command t run --expr "import 'src/pipeline.t'; node_res = read_node(p.drift_guardrail); if (is_error(node_res)) { print('✓ Guardrail failure detected:'); print(error_message(node_res)) } else { print('✖ FAILURE: Guardrail did not trigger!'); exit(1) }"

    - name: 5. Recovery - Adjust Threshold (Policy Update)
      working-directory: ./drift_guardrail_t
      run: |
        echo "Performing recovery: Updating drift policy to 20.0..."
        sed -i 's/drift_val < 2.0/drift_val < 20.0/' src/pipeline.t
        grep "assert" src/pipeline.t

    - name: 6. Final Run & Verification (Recovery Success)
      working-directory: ./drift_guardrail_t
      run: |
        echo "Verifying recovery..."
        nix develop --command t run src/pipeline.t --unsafe
        nix develop --command t run --expr "import 'src/pipeline.t'; node_res = read_node(p.drift_guardrail); if (is_error(node_res)) { print('✖ FAILURE: Guardrail failed after recovery!'); print(error_message(node_res)); exit(1) } else { print('✓ Recovery successful: Guardrail passed.') }"
