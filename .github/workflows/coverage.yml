name: Coverage

on:
  workflow_dispatch:
  repository_dispatch:
    types: [ coverage-run ]
  schedule:
    - cron: '0 3 * * 1'

env:
  BISECT_DIR: /tmp/tlang-coverage
  BISECT_FILE: /tmp/tlang-coverage/bisect

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org https://rstats-on-nix.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= rstats-on-nix.cachix.org-1:vdiiVgocg6WeJrODIqdprZRUrhi1JzhBnXv7aWI6+F0=

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: rstats-on-nix

      - name: Resolve T commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.event.client_payload.repo }}"
          SHA="${{ github.event.client_payload.sha }}"
          if [[ -z "$SHA" || "$SHA" == "null" ]]; then
            REPO="b-rodrigues/tlang"
            SHA=$(gh api repos/b-rodrigues/tlang/commits/main --jq '.sha')
            echo "No dispatch payload, falling back to tlang/main: $SHA"
          fi
          echo "TLANG_REPO=$REPO" >> $GITHUB_ENV
          echo "TLANG_SHA=$SHA" >> $GITHUB_ENV

      - name: Collect coverage across all demos
        run: |
          mkdir -p "$BISECT_DIR"

          find . -name 'pipeline.t' -path '*/src/*' | sort | while read -r script; do
            demo_dir=$(dirname "$(dirname "$script")")
            script_path=$(realpath --relative-to="$demo_dir" "$script")
            echo "--- Running $script ---"
            (
              cd "$demo_dir"
              nix shell \
                "github:$TLANG_REPO/$TLANG_SHA#t-coverage" \
                --command t run --unsafe "$script_path" \
              || true
            )
          done

          for script in \
            pipeline_lens_orchestration_t/src/main.t \
            lens_demo_t/src/pipeline.t \
            deep_data_lenses_t/src/pipeline.t \
            dynamic_pipeline_operator_t/src/pipeline.t \
            error_propagation_circuit_t/src/pipeline.t \
            get_sym_demo_t/src/pipeline.t \
            pipeline_ops_t/src/pipeline.t \
          ; do
            if [ -f "$script" ]; then
              demo_dir=$(dirname "$(dirname "$script")")
              script_path=$(realpath --relative-to="$demo_dir" "$script")
              echo "--- Running standalone: $script ---"
              (
                cd "$demo_dir"
                nix shell \
                  "github:$TLANG_REPO/$TLANG_SHA#t-coverage" \
                  --command t run --unsafe "$script_path" \
                || true
              ) || true
            fi
          done

          echo "Coverage files collected:"
          ls -lh "$BISECT_DIR/"

      - name: Generate HTML coverage report
        run: |
          nix shell \
            "github:$TLANG_REPO/$TLANG_SHA#t-coverage" \
            --command bisect-ppx-report html \
              --coverage-path "$BISECT_DIR" \
              -o _coverage/

      - name: Generate summary (text)
        run: |
          nix shell \
            "github:$TLANG_REPO/$TLANG_SHA#t-coverage" \
            --command bisect-ppx-report summary \
              --coverage-path "$BISECT_DIR" \
          | tee _coverage/summary.txt

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: tlang-coverage-${{ env.TLANG_SHA }}
          path: _coverage/
          retention-days: 30

      - name: Print summary to job log
        run: cat _coverage/summary.txt
