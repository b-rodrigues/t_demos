name: Test ONNX Exchange T Pipeline

on:
  push:
    branches: [ master ]
    paths:
      - 'onnx_exchange_t/**'
  pull_request:
    branches: [ master ]
    paths:
      - 'onnx_exchange_t/**'

jobs:
  test-pipeline:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Nix
      uses: cachix/install-nix-action@v27
      with:
        nix_path: nixpkgs=channel:nixos-unstable

    - name: Setup Cachix
      uses: cachix/cachix-action@v15
      with:
        name: rstats-on-nix
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

    - name: Run ONNX Exchange Pipeline
      working-directory: ./onnx_exchange_t
      run: |
        nix develop --command t run src/pipeline.t --unsafe
