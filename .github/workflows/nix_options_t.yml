name: Demo Nix Options T

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  repository_dispatch:
    types: [ trigger-demo ]

jobs:
  nix-options-t:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nix_options_t

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org https://rstats-on-nix.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= rstats-on-nix.cachix.org-1:vdiiVgocg6WeJrODIqdprZRUrhi1JzhBnXv7aWI6+F0=

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: rstats-on-nix

      - name: Get T commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.event.client_payload.repo }}"
          SHA="${{ github.event.client_payload.sha }}"
          if [[ -z "$SHA" || "$SHA" == "null" ]]; then
            REPO="b-rodrigues/tlang"
            SHA=$(gh api repos/b-rodrigues/tlang/commits/main --jq '.sha')
            echo "No dispatch payload, falling back to tlang/main: $SHA"
          fi
          echo "TLANG_REPO=$REPO" >> $GITHUB_ENV
          echo "TLANG_SHA=$SHA" >> $GITHUB_ENV

      - name: Update to latest T version
        run: |
          nix shell "github:$TLANG_REPO/$TLANG_SHA" --command t update
          # Ensure flake.nix points to the correct version for the build
          if [ -f flake.nix ]; then
            sed -i "s|t-lang.url = \"github:b-rodrigues/tlang/[^\"]*\";|t-lang.url = \"github:$TLANG_REPO/$TLANG_SHA\";|" flake.nix
          fi

      - name: Inject pipeline dependencies
        env:
          TLANG_AUTO_ADD_PIPELINE_DEPS: "1"
        run: |
          nix develop --command t run src/pipeline.t || echo "Dependencies injected (expecting failure to re-lock)"

      - name: Show updated tproject.toml
        run: cat tproject.toml

      - name: Rebuild flake with new dependencies
        run: |
          nix shell "github:$TLANG_REPO/$TLANG_SHA" --command t update

      - name: Run Pipeline with nix-build Interceptor
        run: |
          # Find the real nix-build path in the Nix development environment
          REAL_NIX_BUILD=$(nix develop --command which nix-build | tail -n 1)
          echo "Real nix-build path: $REAL_NIX_BUILD"
          
          # Create mock bin directory
          mkdir -p mock_bin
          cat << 'EOF' > mock_bin/nix-build
          #!/usr/bin/env bash
          echo "[NIX-BUILD-WRAPPER] Intercepted nix-build invocation!" >> nix-build-wrapper.log
          echo "[NIX-BUILD-WRAPPER] Arguments: $@" >> nix-build-wrapper.log
          # Delegate to the real nix-build
          exec REAL_PLACEHOLDER "$@"
          EOF
          
          # Replace placeholder with real nix-build path
          sed -i "s|REAL_PLACEHOLDER|$REAL_NIX_BUILD|g" mock_bin/nix-build
          chmod +x mock_bin/nix-build
          
          # Prepend mock_bin to PATH and run the pipeline
          export PATH="$(pwd)/mock_bin:$PATH"
          nix develop --command t run src/pipeline.t
          
          echo "=== nix-build Interceptor Log ==="
          cat nix-build-wrapper.log

      - name: Verify Passed Options
        run: |
          # Validate that the wrapper intercepted the options and they were correctly passed
          echo "=== Verifying intercepted arguments ==="
          
          # Check for max-jobs
          if grep -q "max-jobs 2" nix-build-wrapper.log; then
            echo "✓ Verified: '--max-jobs 2' was successfully passed to nix-build!"
          else
            echo "✗ Failed: '--max-jobs 2' was not passed to nix-build."
            exit 1
          fi
          
          # Check for dry-run
          if grep -q "dry-run" nix-build-wrapper.log; then
            echo "✓ Verified: '--dry-run' was successfully passed to nix-build!"
          else
            echo "✗ Failed: '--dry-run' was not passed to nix-build."
            exit 1
          fi
          
          # Check for targets / -A
          if grep -q "\-A" nix-build-wrapper.log; then
            echo "✓ Verified: '-A' target option was successfully passed to nix-build!"
          else
            echo "✗ Failed: '-A' target option was not passed to nix-build."
            exit 1
          fi
          
          # Check for force / check
          if grep -q "check" nix-build-wrapper.log; then
            echo "✓ Verified: '--check' (force rebuild) was successfully passed to nix-build!"
          else
            echo "✗ Failed: '--check' was not passed to nix-build."
            exit 1
          fi
          
          echo "All orchestration option verifications passed successfully!"
