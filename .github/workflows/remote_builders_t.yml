name: Demo Remote Builders T

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  repository_dispatch:
    types: [ trigger-demo ]

jobs:
  remote-builders-t:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./remote_builders_t

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org https://rstats-on-nix.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= rstats-on-nix.cachix.org-1:vdiiVgocg6WeJrODIqdprZRUrhi1JzhBnXv7aWI6+F0=
            builders-use-substitutes = true

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: rstats-on-nix

      - name: Get T commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.event.client_payload.repo }}"
          SHA="${{ github.event.client_payload.sha }}"
          if [[ -z "$SHA" || "$SHA" == "null" ]]; then
            REPO="b-rodrigues/tlang"
            SHA=$(gh api repos/b-rodrigues/tlang/commits/main --jq '.sha')
            echo "No dispatch payload, falling back to tlang/main: $SHA"
          fi
          echo "TLANG_REPO=$REPO" >> $GITHUB_ENV
          echo "TLANG_SHA=$SHA" >> $GITHUB_ENV

      - name: Update to latest T version
        run: |
          nix shell "github:$TLANG_REPO/$TLANG_SHA" --command t update
          if [ -f flake.nix ]; then
            sed -i "s|t-lang.url = \"github:b-rodrigues/tlang/[^\"]*\";|t-lang.url = \"github:$TLANG_REPO/$TLANG_SHA\";|" flake.nix
          fi

      - name: Inject pipeline dependencies
        env:
          TLANG_AUTO_ADD_PIPELINE_DEPS: "1"
        run: |
          nix develop --command t run src/pipeline.t || echo "Dependencies injected (expecting failure to re-lock)"

      - name: Show updated tproject.toml
        run: cat tproject.toml

      - name: Rebuild flake with new dependencies
        run: |
          nix shell "github:$TLANG_REPO/$TLANG_SHA" --command t update

      - name: Configure mock localhost remote builder
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Generate SSH key
          ssh-keygen -t ed25519 -N "" -f "$RUNNER_TEMP/remote-builder-key"

          # Configure host SSH config
          cat > ~/.ssh/config <<EOF
          Host gha-builder
            HostName 127.0.0.1
            User root
            Port 2222
            IdentityFile $RUNNER_TEMP/remote-builder-key
            IdentitiesOnly yes
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config

          # Configure root SSH keys and configuration since nix-daemon runs as root
          sudo mkdir -p /root/.ssh
          sudo cp ~/.ssh/config /root/.ssh/config
          sudo cp "$RUNNER_TEMP/remote-builder-key" /root/.ssh/remote-builder-key
          sudo chmod 700 /root/.ssh
          sudo chmod 600 /root/.ssh/config /root/.ssh/remote-builder-key
          sudo chown -R root:root /root/.ssh
          sudo sed -i "s|$RUNNER_TEMP/remote-builder-key|/root/.ssh/remote-builder-key|g" /root/.ssh/config

          # Start a self-contained Nix remote builder container to avoid store/database lock deadlocks
          docker run -d --name gha-builder \
            -p 2222:22 \
            -v "$RUNNER_TEMP/remote-builder-key.pub:/root/.ssh/authorized_keys:ro" \
            lnl7/nix:ssh

          # Wait for container sshd to start and test the connection
          for i in {1..15}; do
            ssh gha-builder 'command -v nix-store && nix-store --version' && break || sleep 1
          done

      - name: Run pipeline with mock remote builder
        env:
          TLANG_REMOTE_BUILDERS: "ssh://gha-builder x86_64-linux - 1 1 - -"
        run: |
          SSH_WRAPPER_LOG="$(pwd)/ssh-wrapper.log"
          rm -f "$SSH_WRAPPER_LOG"
          touch "$SSH_WRAPPER_LOG"
          chmod 666 "$SSH_WRAPPER_LOG"

          # Rename the system ssh and replace it with a wrapper to capture daemon traffic
          sudo mv /usr/bin/ssh /usr/bin/ssh.real
          trap 'sudo mv /usr/bin/ssh.real /usr/bin/ssh || true' EXIT

          sudo cat <<'EOF' > /tmp/ssh-wrapper
          #!/usr/bin/env bash
          echo "[SSH-WRAPPER] $@" >> SSH_WRAPPER_LOG_PLACEHOLDER
          exec /usr/bin/ssh.real "$@"
          EOF
          sudo sed -i "s|SSH_WRAPPER_LOG_PLACEHOLDER|$SSH_WRAPPER_LOG|g" /tmp/ssh-wrapper
          sudo chmod +x /tmp/ssh-wrapper
          sudo mv /tmp/ssh-wrapper /usr/bin/ssh

          nix develop --command bash -lc "export NIX_CONFIG='max-jobs = 0'; t run src/pipeline.t"

          echo "=== SSH wrapper log ==="
          cat "$SSH_WRAPPER_LOG"

      - name: Verify remote builder usage
        run: |
          SSH_WRAPPER_LOG="$(pwd)/ssh-wrapper.log"
          echo "=== Verifying remote builder SSH traffic ==="

          if grep -q "gha-builder" "$SSH_WRAPPER_LOG"; then
            echo "✓ Verified: ssh was invoked against the mock remote builder."
          else
            echo "✗ Failed: expected ssh traffic to gha-builder."
            exit 1
          fi

          if grep -q "nix-store --serve" "$SSH_WRAPPER_LOG"; then
            echo "✓ Verified: Nix attempted to use the remote builder protocol."
          else
            echo "✗ Failed: expected nix-store --serve in ssh traffic."
            exit 1
          fi

          echo "Remote builder verification passed successfully!"
