[project]
name = "quarto_latex_demo"
description = "A polyglot demo of Quarto nodes with LaTeX PDF output in T-Lang"

[r-dependencies]
packages = ["ggplot2", "jsonlite", "knitr", "rmarkdown"]

[py-dependencies]
version = "python314"
packages = ["pandas", "numpy", "ipykernel", "nbclient", "nbformat", "pyyaml"]

[julia-dependencies]
version = "lts"
packages = ["CSV", "DataFrames", "JSON"]

[additional-tools]
packages = ["quarto", "which"]

[latex]
packages = [
  "amsmath",
  "geometry",
  "hyperref",
  "booktabs",
  "caption",
  "fancyhdr",
  "lualatex-math",
  "unicode-math",
  "fontspec",
  "selnolig",
  "xurl",
  "bookmark",
  "framed",
  "fvextra",
  "titling",
  "environ",
  "trimspaces",
  "etoolbox"
]

[t]
min_version = "0.52.0"

[nixpkgs]
date = "2026-04-02"
