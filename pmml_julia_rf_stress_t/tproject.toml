[project]
name = "pmml_julia_rf_stress_t"
version = "0.1.0"
description = "Stress testing Julia PMML scoring with random forest and GLM models"

[r-dependencies]
packages = [ "pmml", "XML", "jsonlite", "r2pmml", "randomForest" ]

[julia-dependencies]
packages = [ "GLM", "DataFrames", "CSV", "JavaCall", "StatsModels" ]

[additional-tools]
packages = [ "jpmml-evaluator", "jre" ]

[t]
min_version = "0.55.0"
