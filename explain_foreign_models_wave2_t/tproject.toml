[project]
name = "explain_foreign_models_wave2_t"
description = "End-to-end validation of explain(p.node).foreign_meta on wave-2 model nodes from R, Python, and Julia"

[dependencies]

[r-dependencies]
packages = ["jsonlite", "mgcv", "nlme", "quantreg", "urca", "cluster", "Matrix", "workflows", "parsnip", "ranger", "betareg", "party", "partykit", "caret", "kernlab", "e1071", "FactoMineR", "igraph", "coda", "glmnet", "dbscan", "gbm", "C50", "earth", "pls", "mclust", "psych", "lavaan", "neuralnet"]

[py-dependencies]
packages = ["statsmodels", "pandas", "numpy", "scikit-learn", "imbalanced-learn", "networkx", "xarray", "polars", "pillow", "gensim", "dask"]

[jl-dependencies]
packages = ["CategoricalArrays", "MultivariateStats", "DataFrames", "Clustering", "Graphs", "JuMP", "Distributions"]

[t]
min_version = "0.56.0"
